# Publishes the app to GitHub Pages. Before each publish it refreshes catalog.json from the store,
# so shirt prices and stock match Shopify. Runs on every push to main and every hour.
name: Deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test image tools, pattern maker and ideas
        run: node --test tests/*.test.mjs
      - name: Refresh shirt catalog from the store
        run: node scripts/sync-catalog.mjs "${{ vars.STORE_URL || 'https://elevatedshirts.com' }}" "${{ vars.BLANKS_COLLECTION || 'builder-blanks' }}"
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html app.js imaging.js geometry.js design.js templates.js store.js styles.css catalog.json manifest.webmanifest robots.txt sitemap.xml fonts art icons _site/
          [ -f CNAME ] && cp CNAME _site/ || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
