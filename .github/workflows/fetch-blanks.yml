# One-off: pulls the blank shirt photo renders from Kittl into the repo for processing.
name: Fetch blank photos
on:
  push:
    branches: [claude/project-thread-hjl90s]
    paths: [.github/workflows/fetch-blanks.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download renders
        run: |
          mkdir -p raw-blanks
          B=https://cache.kittl.com/pr:sharp/plain/api/users/cmg2xuxy59gcc0h7o81r9dnid/uploads
          while read name id; do
            curl -fsSL --retry 3 -o "raw-blanks/$name.png" "$B/$id.png"
          done <<'LIST'
          tee-front-w cmvpfpfm80z2q0j76g14b37bg
          tee-front-k cmvpfpsyg0yzd0j7d5pqyaid2
          tee-back-w cmvpfpiqz0za90j7j3xemha8w
          tee-back-k cmvpfpvbr0yzp0j7dguzva679
          hoodie-front-w cmvpfpljz0z5t0j496l65fu5x
          hoodie-front-k cmvpfpxme0z010j7d9dpbbvc8
          hoodie-back-w cmvpfpq910z410j765bcp1ph4
          hoodie-back-k cmvpfq07h0z0h0j7dee0tblku
          crew-front-w cmvpfq39f0zcr0j7jas8o14e5
          crew-front-k cmvpfqhs90z7b0j767ne25rtr
          crew-back-w cmvpfq6dy0z8s0j49fgr2fk58
          crew-back-k cmvpfqk7x0ywm0j797lh301w6
          tank-front-w cmvpfqaii0z9e0j49er4j732o
          tank-front-k cmvpfqman0zfb0j7jbaypapx7
          tank-back-w cmvpfqerx0yqs0jb05g7ugrqu
          tank-back-k cmvpfqosm0z8c0j76ac4v21wk
          longsleeve-front-w cmvpfqszp0zbs0j491ehbhvza
          longsleeve-front-k cmvpfr9eq0zig0j7j66lbek9l
          longsleeve-back-w cmvpfqxa40zgz0j7j5tnd9ppy
          longsleeve-back-k cmvpfrcxp0z6c0j7d3okve95i
          fitted-front-w cmvpfr2z80z510j7ddukz0syj
          fitted-front-k cmvpfrfxl0z0z0j793avy1kst
          fitted-back-w cmvpfr5xm0zae0j765f0s0nbc
          fitted-back-k cmvpfrjf30z7d0j7d02ulajx3
          LIST
          ls -la raw-blanks
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw-blanks
          git commit -m "Add raw blank photo renders [skip ci]"
          git push
