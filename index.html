<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https:; form-action https://elevatedshirts.com; base-uri 'none'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>EPIX3D | Design your own shirt</title>
  <meta name="description" content="Design your own shirt with EPIX3D: every popular style in one place, with hundreds of fonts and art pieces, a pattern maker and a full set of design tools. Order online, printed in Charleston, SC.">
  <link rel="canonical" href="https://epix3d.com/">
  <meta name="theme-color" content="#0c0d0f">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="EPIX3D">
  <meta property="og:url" content="https://epix3d.com/">
  <meta property="og:title" content="EPIX3D: design your own shirt">
  <meta property="og:description" content="Every style in one place. Pick an idea, mix fonts, art and patterns, and we'll print it for you.">
  <meta property="og:image" content="https://epix3d.com/icons/social.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="icon" type="image/svg+xml" href="icons/mark.svg">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="EPIX3D">
  <link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "EPIX3D shirt builder",
      "url": "https://epix3d.com/",
      "applicationCategory": "DesignApplication",
      "operatingSystem": "Any",
      "description": "Design your own shirt online in any style and order it printed. Checkout through Elevated Designs.",
      "image": "https://epix3d.com/icons/social.png",
      "publisher": { "@type": "Organization", "name": "Elevated Designs", "url": "https://elevatedshirts.com", "address": { "@type": "PostalAddress", "addressLocality": "Charleston", "addressRegion": "SC", "addressCountry": "US" } }
    }
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to the shirt builder</a>
  <header class="site-bar">
    <div class="wrap">
      <a class="brand" href="./" aria-label="EPIX3D home">
        <img src="icons/mark.svg" alt="" width="34" height="34"><span>EPIX<b>3D</b></span>
      </a>
      <nav class="site-nav" aria-label="Store">
        <a href="https://elevatedshirts.com/collections/all">Shop tees</a>
        <a class="cart-link" href="https://elevatedshirts.com/cart">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M5 8h14l-1 12H6L5 8Zm4 0V6a3 3 0 0 1 6 0v2"/></svg>Cart
        </a>
      </nav>
    </div>
  </header>
  <main id="main">
    <div class="sb" data-shirt-builder>
      <noscript><p class="wrap">The shirt builder needs JavaScript turned on.</p></noscript>
      <div class="sb-loading wrap">Loading the shirt builder…</div>
    </div>
  </main>
  <footer class="site-foot">
    <p class="foot-brand"><img src="icons/mark.svg" alt="" width="28" height="28" loading="lazy">EPIX3D · design your own shirt</p>
    <p><a href="https://elevatedshirts.com">Shop</a> · <a href="https://elevatedshirts.com/cart">Cart</a> · <a href="https://elevatedshirts.com/pages/faq">FAQ</a></p>
    <p class="small">EPIX3D is a label of Elevated Designs in Charleston, SC. Orders and payment are handled securely by Shopify at elevatedshirts.com.</p>
  </footer>
  <!-- Settings. storeUrl: the Elevated Designs store (checkout). libraryUrl: the Business Console (public art only).
       libraryFocus: library categories or tags shown first as "Epix3D picks". geometryUrl turns on the Explore pattern maker. -->
  <script type="application/json" data-sb-config>
    {
      "storeUrl": "https://elevatedshirts.com",
      "libraryUrl": "https://business-console.business-console.workers.dev",
      "catalogUrl": "catalog.json",
      "imagingUrl": "./imaging.js",
      "geometryUrl": "./geometry.js",
      "printWidthIn": 12,
      "printHeightIn": 16,
      "maxUploadMb": 20,
      "colorHex": "",
      "heading": "Design your shirt",
      "note": "Every style in one place. Shuffle up a pattern, add art and text, or upload your own, and we'll print it for you in Charleston, SC.",
      "currency": "USD",
      "designIdPrefix": "EPX",
      "libraryFocus": ["Epix3D"],
      "libraryFocusLabel": "EPIX3D picks",
      "librarySearchHint": "Search art, e.g. skull, sunset, flowers",
      "textFont": "Bebas Neue",
      "fonts": [
        ["Bebas Neue", "Bebas+Neue"], ["Anton", "Anton"], ["Bungee", "Bungee"], ["Rubik Mono One", "Rubik+Mono+One"],
        ["Black Ops One", "Black+Ops+One"], ["Russo One", "Russo+One"], ["Orbitron", "Orbitron:wght@800"], ["Monoton", "Monoton"],
        ["Permanent Marker", "Permanent+Marker"], ["Major Mono Display", "Major+Mono+Display"], ["Space Grotesk", "Space+Grotesk:wght@700"], ["Inter", "Inter:wght@800"]
      ]
    }
  </script>
  <script src="app.js" type="module"></script>
</body>
</html>
